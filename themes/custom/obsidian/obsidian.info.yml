name: Obsidian
type: theme
'base theme': stable9
version: 1.0.0
libraries:
  - obsidian/base
  - obsidian/messages
  - core/normalize
  - obsidian/design
libraries-extend:
  user/drupal.user:
    - obsidian/user
  core/drupal.dropbutton:
    - obsidian/dropbutton
  core/drupal.dialog:
    - obsidian/dialog
  file/drupal.file:
    - obsidian/file
  core/drupal.item-list:
    - obsidian/item-list
  core/drupal.progress:
    - obsidian/progress
  core/drupal.tablesort:
    - obsidian/drupal.tablesort
description: "Crystalline Knowledge Vault. A sharp, faceted digital space built for clarity and focus, with glowing violet veins of interaction."
core_version_requirement: ^11
generator: starterkit_theme:11.3.0
regions:
  header: Branding
  primary_menu: Primary navigation
  secondary_menu: Actions
  breadcrumb: Breadcrumb
  highlighted: Status messages
  help: Help
  hero: Hero
  content: Content
  sidebar_first: Left sidebar
  sidebar_second: Right sidebar
  feature: Feature sections
  footer: Footer
