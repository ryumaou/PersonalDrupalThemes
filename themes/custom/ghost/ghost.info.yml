name: Ghost
type: theme
'base theme': stable9
version: 1.0.0
libraries:
  - ghost/base
  - ghost/messages
  - core/normalize
  - ghost/design
libraries-extend:
  user/drupal.user:
    - ghost/user
  core/drupal.dropbutton:
    - ghost/dropbutton
  core/drupal.dialog:
    - ghost/dialog
  file/drupal.file:
    - ghost/file
  core/drupal.item-list:
    - ghost/item-list
  core/drupal.progress:
    - ghost/progress
  core/drupal.tablesort:
    - ghost/drupal.tablesort
description: "Monumental type on infinite white paper"
core_version_requirement: ^11
generator: starterkit_theme:11.3.0
regions:
  header: Branding
  primary_menu: Primary navigation
  secondary_menu: Actions
  breadcrumb: Breadcrumb
  highlighted: Status messages
  help: Help
  hero: Hero
  content: Content
  sidebar_first: Left sidebar
  sidebar_second: Right sidebar
  feature: Feature sections
  footer: Footer
